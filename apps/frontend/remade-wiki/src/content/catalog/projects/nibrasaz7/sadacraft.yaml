# Broader alternative scope: covers meeting transcription/notes (Tactiq,
# Read AI, Granola) and the virtual-camera pipeline (XSplit VCam) in one app.
slug: sadacraft
name: SadaCraft
authors: [nibrasaz7]
repository: https://github.com/NibrasAz7/SadaCraft
originals: [tactiq, read-ai, granola, xsplit-vcam]
category: productivity
languages: [Rust, TypeScript]
platforms: [Windows]
status: alpha
compatibility: targeting
description: A local-first meeting companion for Windows combining Tactiq/Read AI-class meeting capture and Granola-style on-device notes with an XSplit VCam-class virtual camera. Provides mic plus system-audio recording, local whisper.cpp transcription with Vulkan GPU acceleration (English, Arabic, Italian), speaker attribution with optional ONNX remote-speaker clustering, local or API AI summaries with a self-improving per-template lessons loop, Markdown/DOCX/PDF export, and a shared-memory-fed virtual camera with webcam capture and name-card overlays.
license: MIT OR Apache-2.0
docs: https://github.com/NibrasAz7/SadaCraft#readme
limitations: Alpha; compatibility is maintainer-reported. Windows only and verified by the maintainer. Built on the MIT-licensed Meetily transcription base. Speaker labels map streams plus optional session clustering rather than enrolment-grade diarization; ONNX background segmentation, teleprompter/subtitle overlays and per-client camera format routing remain planned; CUDA acceleration is staged but unverified. Virtual-camera deployment requires a service install step.
