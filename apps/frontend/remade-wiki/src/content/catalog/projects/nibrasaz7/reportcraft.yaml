originals: [microsoft-power-bi, sap-businessobjects]
category: productivity
languages: [Rust]
platforms: [Linux, macOS, Windows, Web]
status: alpha
compatibility: partial
description: An independent Rust business-intelligence studio targeting Microsoft Power BI and SAP BusinessObjects workflows, with a columnar store, Power Query step transforms and SQL query folding, star-schema relationships, DAX-class measures (SUMX, CALCULATE, TOTALYTD), Row-Level Security, Power BI TMDL interop, egui Studio, SVG/HTML/PDF 1.4 export, report bursting, CLI and MCP.
license: MIT OR Apache-2.0
limitations: Alpha; compatibility is maintainer-reported. Live database wire protocols (PostgreSQL/SQL Server/Oracle), binary Excel .xlsx/Parquet readers, and proprietary binary .pbix container parsing (use Power BI .pbip/.tmdl text format) are not yet implemented.
